<text x="902" y="175" font-family="Courier New,monospace" font-size="11" text-anchor="start" fill="#343b32">01  Collect source information</text>
<text x="902" y="209" font-family="Courier New,monospace" font-size="11" text-anchor="start" fill="#343b32">02  Check drawing references</text>
