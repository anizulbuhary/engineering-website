<text x="902" y="420" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#343b32">FW-S01 locates the structural bays.</text>
<text x="902" y="440" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#343b32">FW-S02 identifies beam sections and bars.</text>
