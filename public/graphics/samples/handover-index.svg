<text x="902" y="480" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#343b32">FW-S04 records coordination interfaces.</text>
<text x="902" y="500" font-family="Helvetica,Arial,sans-serif" font-size="11" text-anchor="start" fill="#343b32">FW-S05 shows column reinforcement.</text>
